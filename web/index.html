<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Untitled: Infra Tracker — what India is building, and what it isn't</title>
<meta name="description" content="A globe of India's public infrastructure projects, built from government sources, with provenance on every number.">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="globe" role="application" aria-label="3D globe of infrastructure projects"></div>

<div id="boot" class="boot">
  <div class="boot-inner">
    <div class="boot-mark">◆</div>
    <div class="boot-title">Untitled: Infra Tracker</div>
    <div class="boot-status" id="boot-status">Loading globe…</div>
  </div>
</div>

<header class="topbar" hidden>
  <div class="brand">
    <span class="brand-mark">◆</span>
    <span class="brand-name">Untitled: Infra Tracker</span>
    <span class="brand-tag">what India is building, and what it isn't</span>
  </div>
  <div class="topstats" id="topstats"></div>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="Search projects…" autocomplete="off"
           aria-label="Search projects" spellcheck="false">
    <div id="suggest" class="suggest" hidden></div>
  </div>
</header>

<aside class="filters" id="filters" hidden>
  <button class="filters-toggle" id="filters-toggle" aria-expanded="true">Filters</button>
  <div class="filters-body" id="filters-body">
    <section>
      <h3>Show</h3>
      <div class="seg" role="group" aria-label="Project state">
        <button data-half="all" class="on">Everything</button>
        <button data-half="building">Being built</button>
        <button data-half="contested">Contested</button>
        <button data-half="blocked">Halted</button>
      </div>
    </section>
    <section>
      <h3>Sector</h3>
      <div class="chips" id="sector-chips"></div>
    </section>
    <section>
      <h3>Status</h3>
      <div class="chips" id="status-chips"></div>
    </section>
    <section>
      <h3>Minimum cost</h3>
      <input type="range" id="cost-range" min="0" max="100000" step="1000" value="0">
      <div class="range-label" id="cost-label">Any size</div>
    </section>
    <section class="toggles">
      <label><input type="checkbox" id="toggle-corridors" checked> Show corridors</label>
      <label><input type="checkbox" id="toggle-vague"> Hide state-centroid guesses</label>
      <label><input type="checkbox" id="toggle-spin" checked> Auto-rotate</label>
    </section>
    <button class="reset" id="reset">Reset filters</button>
  </div>
</aside>

<div class="legend" id="legend" hidden></div>

<aside class="panel" id="panel" hidden aria-live="polite"></aside>

<footer class="footer" id="footer" hidden></footer>

<div class="fatal" id="fatal" hidden>
  <div class="fatal-inner">
    <h2 id="fatal-title">Could not start</h2>
    <p id="fatal-body"></p>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
