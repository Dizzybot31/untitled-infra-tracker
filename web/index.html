<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Untitled: Infra Tracker — what India is building, and how late it is</title>
<meta name="description" content="India's public infrastructure projects on a 3D globe, built from government records, with the source and retrieval date attached to every figure.">
<link rel="stylesheet" href="css/app.css">
<!-- One self-contained UMD bundle (three.js inlined). This replaced a 150-request
     esm.sh module graph that took 5.3s before anything could render. -->
<script src="vendor/globe.gl-2.46.2.min.js"></script>
</head>
<body>

<main id="globe" aria-label="3D globe of Indian infrastructure projects"></main>

<!-- First paint, no JS required. Counts are deliberately NOT baked in here:
     they are filled from meta.json at runtime so they can never ship stale. -->
<div id="boot" class="boot">
  <div class="boot-inner">
    <div class="boot-title">Untitled: Infra Tracker</div>
    <p class="boot-pitch">
      Indian public infrastructure, built from government records.
      <span id="boot-counts" class="boot-counts"></span>
    </p>
    <p class="boot-sub">Every figure carries its source and the date we fetched it.</p>
    <div class="boot-rule"><span></span></div>
  </div>
</div>

<header class="topbar" hidden>
  <div class="brand">
    <h1 class="brand-name">Untitled: Infra Tracker</h1>
    <p class="brand-tag">India's public infrastructure, with its paperwork attached</p>
  </div>
  <div class="topbar-tools">
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search projects…" autocomplete="off"
             aria-label="Search projects" spellcheck="false">
      <div id="suggest" class="suggest" hidden role="listbox" aria-label="Search results"></div>
    </div>
    <button id="about-btn" class="ghost-btn">About &amp; sources</button>
  </div>
</header>

<!-- The view bar is the only filter AND the entire legend. The key row is a census
     that sums to the drawn total, so the numbers can never read as a false partition. -->
<div class="viewbar" id="viewbar" hidden>
  <div class="key" id="key"></div>
  <div class="seg" id="seg" role="radiogroup" aria-label="Which projects to show"></div>
  <p class="caveat" id="caveat"></p>
  <button class="linky" id="toggle-open" aria-pressed="false"></button>
</div>

<aside class="panel" id="panel" hidden role="dialog" aria-modal="false" aria-labelledby="panel-title"></aside>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
<div class="scrim" id="scrim" hidden></div>

<ul id="a11y-list" class="sr-only" aria-label="Projects currently shown"></ul>

<div class="fatal" id="fatal" hidden>
  <div class="fatal-inner">
    <h2>Could not start</h2>
    <p id="fatal-body"></p>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
