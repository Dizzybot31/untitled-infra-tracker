name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor because that is what ships with macOS command line
        # tools, and the project is meant to run there with zero setup.
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests
        run: python3 -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Pipeline runs clean end to end
        run: |
          python3 -m pipeline.run ingest --only seed --strict
          python3 -m pipeline.run link
          python3 -m pipeline.run publish
      - name: Published output is valid GeoJSON with sane coordinates
        run: |
          python3 - <<'PY'
          import json, sys
          fc = json.load(open('data/derived/projects.geojson'))
          assert fc['type'] == 'FeatureCollection', fc['type']
          assert fc['features'], 'published an empty FeatureCollection'
          for f in fc['features']:
              lon, lat = f['geometry']['coordinates']
              assert 65 <= lon <= 98 and 5 <= lat <= 38, (f['properties']['id'], lon, lat)
              assert f['properties'].get('title'), f['properties']
          print('ok: %d features' % len(fc['features']))
          PY
