# GitHub Pages publisher — SUPERSEDED BY VERCEL, kept only as a manual fallback.
#
# Two reasons the automatic trigger is gone:
#
# 1. It never worked the way the old comment here claimed. This workflow
#    triggered on `push`, but refresh.yml pushes using the default GITHUB_TOKEN,
#    and GitHub does not run workflows for GITHUB_TOKEN-authored pushes. So the
#    Pages site only ever updated when a human pushed — it has been serving data
#    older than the last cron run. (Vercel is not subject to this: its GitHub App
#    consumes push webhooks, which do fire for GITHUB_TOKEN pushes.)
#
# 2. Leaving it on `push` would publish a second, competing copy of the site that
#    silently diverges from the Vercel deployment. Two live URLs for one dataset
#    is exactly the provenance problem this project exists to avoid.
#
# workflow_dispatch is retained so there is a tested fallback publisher while the
# Vercel path is being confirmed. Once Vercel has survived a few scheduled
# refreshes, delete this file and turn Pages off in Settings → Pages.

name: deploy pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/web _site/data/derived
          cp -R web/. _site/web/
          cp -R data/derived/. _site/data/derived/
          # Keep the repo's relative layout (web/ alongside data/) so the same
          # paths work locally and in production, and send / to the app.
          cat > _site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8">
          <title>Untitled: Infra Tracker</title>
          <meta http-equiv="refresh" content="0; url=./web/">
          <link rel="canonical" href="./web/">
          <p style="font:14px system-ui;background:#05070c;color:#e8edf6">
            Redirecting to <a style="color:#22d39a" href="./web/">the globe</a>.
          </p>
          HTML
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
